name: velqora
x-app-env: &app-env
  ConnectionStrings__Postgres: Host=postgres;Database=velqora;Username=velqora;Password=${POSTGRES_PASSWORD:?Run bootstrap.ps1}
  RabbitMq: amqp://velqora:${RABBITMQ_PASSWORD:?Run bootstrap.ps1}@rabbitmq:5672/
  Redis: redis:6379,password=${REDIS_PASSWORD:?Run bootstrap.ps1},abortConnect=false
  DemoPassword: ${DEMO_PASSWORD:?Run bootstrap.ps1}
  IngestionApiKey: ${INGESTION_API_KEY:?Run bootstrap.ps1}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4317
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_ENVIRONMENT: Production
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: velqora
      POSTGRES_USER: velqora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap.ps1}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velqora -d velqora"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: velqora
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run bootstrap.ps1}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Run bootstrap.ps1}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run bootstrap.ps1}
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: {PROJECT: Velqora.Api}
    environment:
      <<: *app-env
      DataProtectionPath: /app/keys
    ports: ["127.0.0.1:8080:8080"]
    volumes: [data-protection:/app/keys]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: {PROJECT: Velqora.Worker}
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  dashboard:
    build:
      context: src/frontend/velqora-dashboard
      dockerfile: ../../../infrastructure/docker/frontend.Dockerfile
    ports: ["127.0.0.1:4200:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  otel:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otel/config.yml"]
    volumes: ["./infrastructure/monitoring/otel.yml:/etc/otel/config.yml:ro"]
    profiles: [monitoring]
    depends_on: [jaeger]
    restart: unless-stopped
  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
    profiles: [monitoring]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes: ["./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    profiles: [monitoring]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: velqora
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run bootstrap.ps1}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["grafana-data:/var/lib/grafana", "./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro", "./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    ports: ["127.0.0.1:3000:3000"]
    profiles: [monitoring]
    restart: unless-stopped
volumes:
  postgres-data:
  rabbit-data:
  redis-data:
  data-protection:
  prometheus-data:
  grafana-data:
